name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-connector:
    name: Rust connector (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify package archive
        if: runner.os == 'Linux'
        run: cargo package --locked --allow-dirty -p cybercore-agent

  worker:
    name: Worker TypeScript
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check Worker
        run: npm run check
      - name: Validate deployment preflight
        run: npm run preflight && npm run test:preflight
      - name: Validate staging bindings
        run: npx wrangler deploy --env=staging --dry-run --outdir /tmp/cybercore-mission-control-dry-run
      - name: Run local end-to-end smoke
        run: npm run smoke:local
