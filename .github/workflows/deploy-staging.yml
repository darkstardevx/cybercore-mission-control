name: Staging dry run

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type STAGING_DRY_RUN to run the staging-only binding validation
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-staging:
    if: inputs.confirmation == 'STAGING_DRY_RUN'
    name: Validate staging deployment shape
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - name: Check out
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate local safety boundary
        run: npm run preflight && npm run test:preflight && npm run test:protocol
      - name: Validate staging bindings without deployment
        run: npx wrangler deploy --env=staging --dry-run --outdir /tmp/cybercore-mission-control-staging-dry-run
