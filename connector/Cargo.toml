[package]
name = "cybercore-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Outbound-only heartbeat connector for Cybercore Mission Control"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rand = "0.8.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.2.0", default-features = false, features = ["json", "rustls"] }
url = "2.5.7"
